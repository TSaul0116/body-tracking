<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Body Tracker - White Edition</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        /* 極簡白色風格 */
        body { 
            background-color: #ffffff; 
            color: #333; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
        }

        .header { margin-top: 20px; text-align: center; }
        h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; color: #000; margin: 10px 0; }

        /* 畫布容器：負責全螢幕與放大功能 */
        #container {
            position: relative;
            width: 90vw;
            height: 60vh;
            background: #f0f0f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保畫面不變形 */
        }

        /* 按鈕區域 */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        button {
            padding: 12px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        button:active { background: #f0f0f0; transform: scale(0.95); }

        #status { margin-top: 15px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI BODY TRACKER</h1>
    </div>

    <div id="container">
        <video id="input_video" style="display:none;" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <button onclick="toggleCamera()">切換鏡頭</button>
        <button onclick="goFullScreen()">全螢幕模式</button>
    </div>

    <div id="status">系統載入中...</div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status');
        
        let currentFacingMode = "user"; // 預設前鏡頭
        let camera = null;

        function onResults(results) {
            statusText.innerText = "LIVE DATA ACTIVE";
            
            // 同步畫布尺寸
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // --- 核心修改：在同一個畫面畫出影像與骨架 ---
            // 1. 先畫出攝影機的真實畫面
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // 2. 在上面疊加骨架線條 (改用深藍色/黑色，配合白色背景比較美)
            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                               {color: '#00FF00', lineWidth: 4}); // 亮綠色骨架
                drawLandmarks(canvasCtx, results.poseLandmarks,
                              {color: '#FF0000', lineWidth: 1}); // 紅色節點
            }
            canvasCtx.restore();
        }

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        // 啟動鏡頭的函數
        function startCamera(facingMode) {
            if (camera) { camera.stop(); }
            
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await holistic.send({image: videoElement});
                },
                width: 1280,
                height: 720,
                facingMode: facingMode
            });
            camera.start();
        }

        // 切換鏡頭邏輯
        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera(currentFacingMode);
            statusText.innerText = "切換鏡頭中...";
        }

        // 全螢幕邏輯
        function goFullScreen() {
            const container = document.getElementById('container');
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.webkitRequestFullscreen) { /* iOS Safari */
                container.webkitRequestFullscreen();
            }
        }

        // 初始啟動
        startCamera(currentFacingMode);
    </script>
</body>
</html>
